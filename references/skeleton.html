<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>__TITLE__</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 26px 20px 60px;
    font-family: "PingFang SC","Microsoft YaHei",-apple-system,"Segoe UI",sans-serif;
    background: linear-gradient(180deg,#f5f7fa 0%,#eef1f6 100%);
    color: #1f2d3d;
  }
  .wrap { max-width: 960px; margin: 0 auto; }
  h1 { font-size: 23px; margin: 0 0 4px; font-weight: 700; }
  h2 { font-size: 16px; margin: 0 0 12px; font-weight: 700; display:flex; align-items:center; gap:8px; }
  .lead { color: #6b7785; font-size: 13px; line-height: 1.75; margin-bottom: 18px; white-space: pre-line; }
  .panel { background:#fff; border:1px solid #e7ebf1; border-radius:14px; padding:18px 20px; margin-bottom:16px;
           box-shadow:0 2px 12px rgba(31,45,61,.045); }

  /* ---------- 复盘笔记 ---------- */
  .note-head { display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:4px; }
  .taskline { font-size:13px; color:#41505f; background:#f3f6fb; border-left:3px solid #1565d8;
              padding:8px 12px; border-radius:0 8px 8px 0; margin:10px 0 14px; line-height:1.6; }
  .taskline b { color:#1565d8; }
  .layer { border-top:1px dashed #e7ebf1; padding-top:12px; margin-top:12px; }
  .layer:first-of-type { border-top:none; padding-top:0; margin-top:0; }
  .layer-h { display:flex; align-items:center; gap:8px; font-size:13px; font-weight:700; color:#2b3a49; margin-bottom:8px; }
  .lv { font-size:10.5px; font-weight:800; color:#fff; background:#41505f; border-radius:4px; padding:1px 6px; letter-spacing:.3px; }
  .lv.l4 { background:#7c5cd6; }
  .layer-sub { font-size:11.5px; color:#8a96a3; font-weight:400; }

  .fitem { display:flex; gap:9px; padding:7px 0; font-size:13px; line-height:1.65; }
  .fitem .no { flex:0 0 auto; width:18px; height:18px; border-radius:50%; background:#eef1f6;
               color:#5b6675; font-size:11px; font-weight:700; display:flex; align-items:center; justify-content:center; margin-top:2px; }
  .fitem .txt { flex:1; }
  .fitem .ev { display:inline-block; font-size:11.5px; color:#1a7f5a; background:#eefaf3;
               border:1px solid #d3f0e0; border-radius:5px; padding:1px 7px; margin-top:5px; line-height:1.6; }
  .fitem .ev.miss { color:#b45309; background:#fff8ec; border-color:#f5e0bd; }
  .fitem .rc { font-size:11px; font-weight:700; color:#7c5cd6; background:#f3efff; border-radius:4px; padding:1px 6px; margin-right:6px; }
  .fitem .fixline { font-size:12.5px; color:#6b7785; margin-top:4px; }
  .fitem .fixline b { color:#1f2d3d; }
  .firststep { font-size:14px; font-weight:700; color:#0f4fa8; background:#f2f7ff;
               border:1px solid #dbe8fb; border-radius:9px; padding:11px 14px; line-height:1.6; }
  .empty { font-size:12.5px; color:#a8b2be; font-style:italic; }

  /* ---------- 差异对比台 ---------- */
  .vq { font-size:13px; color:#41505f; margin-bottom:12px; line-height:1.6; }
  .vq b { color:#7c5cd6; }
  table { border-collapse:collapse; width:100%; font-size:12.5px; }
  .vt th, .vt td { border:1px solid #eceff3; padding:8px 10px; text-align:left; vertical-align:top; }
  .vt thead th { background:#f3f6fb; color:#41505f; font-weight:700; }
  .vt tbody tr:nth-child(even) { background:#fafbfd; }
  .vt td.nm { font-weight:700; color:#2b3a49; white-space:nowrap; }
  .vt td.note { color:#6b7785; font-size:12px; }
  .verdict { margin-top:12px; font-size:13px; line-height:1.7; color:#2b3a49;
             background:#f6f3ff; border:1px solid #e4dcfb; border-radius:9px; padding:11px 14px; }
  .verdict b { color:#7c5cd6; }

  /* ---------- 闸门仪表 ---------- */
  .gates { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:16px; }
  .gate { flex:1 1 140px; background:#fff; border:1px solid #e7ebf1; border-radius:11px; padding:11px 14px; }
  .gate .gk { font-size:11.5px; color:#6b7785; font-weight:600; }
  .gate .gv { font-size:20px; font-weight:800; color:#1565d8; margin-top:2px; font-variant-numeric:tabular-nums; }
  .gate .gs { font-size:11px; color:#9aa5b1; margin-top:1px; }
  .gate.warn { border-color:#f5d9a8; background:#fffcf5; }
  .gate.warn .gv { color:#c2740a; }
  .gate.bad { border-color:#f3c1c1; background:#fff8f8; }
  .gate.bad .gv { color:#d13b3b; }

  /* ---------- 候选区 ---------- */
  .sec-title { display:flex; align-items:center; gap:10px; font-size:15px; font-weight:700; margin: 24px 0 11px; }
  .sec-title .tag { font-size:11.5px; font-weight:700; padding:2px 9px; border-radius:20px; }
  .sec-title .cnt { font-size:12px; color:#9aa5b1; font-weight:500; margin-left:auto; }
  .tag-memory { background:#e7f0ff; color:#1565d8; }
  .tag-skill  { background:#eafaef; color:#1a9c5b; }
  .tag-prompt { background:#f3efff; color:#7c5cd6; }
  .tag-manual { background:#fff5e6; color:#c2740a; }

  .toolbar { display:flex; gap:9px; flex-wrap:wrap; margin: 4px 0 6px; }
  .btn {
    border:1px solid #d6deea; background:#fff; color:#41505f; padding:8px 14px;
    border-radius:8px; font-size:13px; cursor:pointer; font-weight:600; transition:.15s;
  }
  .btn:hover { border-color:#9bb4d8; color:#1565d8; }
  .btn.primary { background:#1565d8; border-color:#1565d8; color:#fff; }
  .btn.primary:hover { background:#0f56bd; color:#fff; }
  .btn.ghost { background:#f7f9fc; }

  .card {
    background:#fff; border:1px solid #e7ebf1; border-radius:12px; padding:14px 16px;
    margin-bottom:11px; box-shadow:0 2px 10px rgba(31,45,61,.04); transition:.15s;
  }
  .card.checked { border-color:#1565d8; box-shadow:0 2px 14px rgba(21,101,216,.12); }
  .card-head { display:flex; align-items:flex-start; gap:10px; cursor:pointer; }
  .card-head input { margin-top:4px; width:17px; height:17px; cursor:pointer; flex:0 0 auto; }
  .card-id { font-size:11px; font-weight:700; color:#fff; background:#41505f; border-radius:5px; padding:1px 7px; margin-right:6px; }
  .card-title { font-size:14.5px; font-weight:700; color:#1f2d3d; }
  .card-why { font-size:12.5px; color:#6b7785; margin:7px 0 0 27px; line-height:1.65; }
  .metas { display:flex; gap:6px; flex-wrap:wrap; margin:7px 0 0 27px; }
  .meta { font-size:10.5px; font-weight:700; border-radius:5px; padding:1px 7px; line-height:1.7; }
  .conf-high   { background:#eefaf3; color:#1a7f5a; }
  .conf-medium { background:#fff8ec; color:#b45309; }
  .scope-single    { background:#f2f4f7; color:#6b7785; }
  .scope-recurring { background:#eef4ff; color:#1565d8; }
  .scope-cross     { background:#f6f3ff; color:#7c5cd6; }
  .meta-ev { background:#f2f4f7; color:#5b6675; font-weight:600; }

  .prompt-box { display:none; margin:12px 0 0 27px; }
  .prompt-box.show { display:block; }
  .prompt-label { font-size:12px; font-weight:700; color:#1565d8; margin-bottom:6px; display:flex; justify-content:space-between; align-items:center; }
  textarea {
    width:100%; min-height:118px; resize:vertical; border:1px solid #dfe5ee; border-radius:8px;
    padding:10px 12px; font-size:12.5px; line-height:1.6; color:#2b3a49;
    font-family:"SFMono-Regular",Consolas,"Microsoft YaHei",monospace; background:#fafbfd;
  }
  .copy-mini { border:none; background:transparent; color:#1565d8; font-size:12px; font-weight:700; cursor:pointer; padding:0; }
  .copy-mini:hover { text-decoration:underline; }
  .summary { margin-top:14px; }
  .summary textarea { background:#fbfdff; }
  .note { font-size:12px; color:#8a96a3; margin-top:16px; line-height:1.75; }
  .note strong { color:#5b6675; }
  @media (max-width:640px){
    body { padding:18px 12px 48px; }
    .panel { padding:14px; }
    .vt { display:block; overflow-x:auto; }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>__TITLE__</h1>
  <div class="lead">__LEAD__</div>

  <!-- ============ 复盘笔记 ============ -->
  <div class="panel" id="notePanel">
    <div class="note-head">
      <h2 style="margin:0">复盘笔记 <span class="layer-sub">四层深度 · 每条一句话</span></h2>
      <div style="display:flex;gap:8px">
        <button class="btn ghost" onclick="copyNote()">复制复盘笔记</button>
        <button class="btn ghost" onclick="copyRetroPrompt()">复制复盘提示词</button>
      </div>
    </div>
    <div class="taskline">任务：<b id="taskLine">—</b></div>
    <div id="layers"></div>
  </div>

  <!-- ============ 差异对比台 ============ -->
  <div class="panel" id="vPanel" style="display:none">
    <h2>差异对比台 <span class="layer-sub">Harness² · 比差量不比绝对分</span></h2>
    <div class="vq">核心问题：<b id="vQuestion">—</b></div>
    <div class="vt" id="vTable"></div>
    <div class="verdict" id="vVerdict"></div>
  </div>

  <!-- ============ 闸门 ============ -->
  <div class="gates" id="gates"></div>

  <!-- ============ 工具栏 ============ -->
  <div class="toolbar">
    <button class="btn" onclick="selectAll(true)">全选</button>
    <button class="btn" onclick="selectAll(false)">清空</button>
    <button class="btn" onclick="copyChecked()">复制已勾选提示词</button>
    <button class="btn primary" onclick="buildSummary()">生成确认清单</button>
  </div>

  <!-- ============ 四类候选 ============ -->
  <div class="sec-title"><span class="tag tag-memory">记忆</span>事实与口径，沉进长期记忆<span class="cnt" id="cnt-memory"></span></div>
  <div id="list-memory"></div>

  <div class="sec-title"><span class="tag tag-skill">技能</span>可复用流程，固化成 Skill<span class="cnt" id="cnt-skill"></span></div>
  <div id="list-skill"></div>

  <div class="sec-title"><span class="tag tag-prompt">提示词</span>改表达方式，流程不变<span class="cnt" id="cnt-prompt"></span></div>
  <div id="list-prompt"></div>

  <div class="sec-title"><span class="tag tag-manual">改进手册</span>跨任务方法论，写进 playbook<span class="cnt" id="cnt-manual"></span></div>
  <div id="list-manual"></div>

  <div class="card summary">
    <div class="prompt-label">确认清单（勾选项汇总，可直接发给 AI 执行）<span class="copy-mini" onclick="copySummary()">复制</span></div>
    <textarea id="summaryBox" readonly placeholder="点击「生成确认清单」后在此显示…"></textarea>
  </div>

  <div class="note">
    本页为<strong>待确认</strong>用途，不会自动写入任何记忆、改动提示词或创建 Skill。<br>
    勾选并复制提示词后，由你确认再执行；标 <strong>待验证</strong> 的项建议先小范围试一次再落地。
  </div>
</div>

<script>
const RETRO_DATA = __DATA__;
const D = RETRO_DATA;
const TYPE_META = {
  memory: {label:"记忆",     cls:"tag-memory"},
  skill:  {label:"技能",     cls:"tag-skill"},
  prompt: {label:"提示词",   cls:"tag-prompt"},
  manual: {label:"改进手册", cls:"tag-manual"}
};

/* ---------- 工具 ---------- */
function el(tag, cls, text){
  const n = document.createElement(tag);
  if(cls) n.className = cls;
  if(text != null) n.textContent = text;
  return n;
}
function items(){
  return (D.items || []).filter(it => it.confidence !== "low");
}
function itemsBy(type){
  return items().filter(it => it.type === type);
}

/* ---------- 复盘笔记 ---------- */
function renderNote(){
  const f = D.findings || {};
  document.getElementById("taskLine").textContent = D.task || "（未填写任务描述）";
  const box = document.getElementById("layers");
  box.innerHTML = "";

  // L1 有效做法
  const l1 = el("div","layer");
  l1.appendChild(layerHead("L1","事实层 · 管用的做法","只收有结果支撑的，≤3 条"));
  const worked = f.worked || [];
  if(!worked.length){
    l1.appendChild(el("div","empty","（未填写：本次没有可指认的有效做法）"));
  } else {
    worked.forEach((w,i) => {
      const row = el("div","fitem");
      row.appendChild(el("div","no", String(i+1)));
      const t = el("div","txt");
      t.appendChild(el("div",null,w.text));
      const ev = el("div","ev" + (w.evidence ? "" : " miss"), w.evidence ? "依据：" + w.evidence : "缺少证据支撑");
      t.appendChild(ev);
      row.appendChild(t);
      l1.appendChild(row);
    });
  }
  box.appendChild(l1);

  // L2 弯路
  const l2 = el("div","layer");
  l2.appendChild(layerHead("L2","归因层 · 走过的弯路","根因四选一：信息缺失 / 判断错误 / 执行失误 / 工具缺陷"));
  const detours = f.detours || [];
  if(!detours.length){
    l2.appendChild(el("div","empty","（未填写：本次没有明显返工或试错）"));
  } else {
    detours.forEach((d,i) => {
      const row = el("div","fitem");
      row.appendChild(el("div","no", String(i+1)));
      const t = el("div","txt");
      const head = el("div");
      if(d.rootCause) head.appendChild(el("span","rc", d.rootCause));
      head.appendChild(document.createTextNode(d.text || ""));
      t.appendChild(head);
      if(d.fix){
        const fx = el("div","fixline");
        fx.appendChild(el("b",null,"下次避开："));
        fx.appendChild(document.createTextNode(d.fix));
        t.appendChild(fx);
      }
      row.appendChild(t);
      l2.appendChild(row);
    });
  }
  box.appendChild(l2);

  // L3 第一步
  const l3 = el("div","layer");
  l3.appendChild(layerHead("L3","迁移层 · 下次第一步","必须是可执行的第一个动作，不是原则"));
  if(f.firstStep){
    l3.appendChild(el("div","firststep", f.firstStep));
  } else {
    l3.appendChild(el("div","empty","（未填写：没有「下次第一步」，本次复盘停在纸面）"));
  }
  box.appendChild(l3);

  // L4 元改
  const l4 = el("div","layer");
  l4.appendChild(layerHead("L4","元改层 · Harness 该改哪一环","提示词 / 工具 / 记忆 / 技能", true));
  const meta = f.meta;
  if(meta){
    const row = el("div","fitem");
    row.appendChild(el("div","no","→"));
    row.appendChild(el("div","txt", meta));
    l4.appendChild(row);
  } else {
    l4.appendChild(el("div","empty","（未填写：未指出 harness 的改动点）"));
  }
  box.appendChild(l4);
}
function layerHead(code, name, sub, isMeta){
  const h = el("div","layer-h");
  h.appendChild(el("span","lv" + (isMeta ? " l4" : ""), code));
  h.appendChild(document.createTextNode(name));
  if(sub) h.appendChild(el("span","layer-sub", "· " + sub));
  return h;
}

/* ---------- 差异对比台 ---------- */
function renderVariants(){
  const v = D.variants;
  if(!v || !v.list || !v.list.length) return;
  document.getElementById("vPanel").style.display = "block";
  document.getElementById("vQuestion").textContent = v.question || "（未填写）";

  const dims = v.dims || [];
  const tbl = el("table");
  const thead = el("thead");
  const hr = el("tr");
  hr.appendChild(el("th",null,"方案 / 维度"));
  dims.forEach(d => hr.appendChild(el("th",null,d)));
  hr.appendChild(el("th",null,"备注"));
  thead.appendChild(hr);
  tbl.appendChild(thead);

  const tb = el("tbody");
  v.list.forEach(row => {
    const tr = el("tr");
    tr.appendChild(el("td","nm", row.name || "—"));
    dims.forEach((_,i) => tr.appendChild(el("td",null, (row.scores && row.scores[i] != null) ? row.scores[i] : "—")));
    tr.appendChild(el("td","note", row.note || ""));
    tb.appendChild(tr);
  });
  tbl.appendChild(tb);

  const host = document.getElementById("vTable");
  host.innerHTML = "";
  host.appendChild(tbl);

  const vd = document.getElementById("vVerdict");
  vd.innerHTML = "";
  vd.appendChild(el("b",null,"结论："));
  vd.appendChild(document.createTextNode(v.verdict || "（未给结论——没有结论的对比等于没做）"));
}

/* ---------- 闸门 ---------- */
function renderGates(){
  const f = D.findings || {};
  const w = (f.worked || []).length;
  const dt = (f.detours || []).length;
  const hasFirst = !!(f.firstStep && String(f.firstStep).trim());
  const total = w + dt + (hasFirst ? 1 : 0);
  const all = items();
  const withEv = all.filter(it => it.evidence && String(it.evidence).trim()).length;
  const pending = all.filter(it => it.confidence === "medium").length;
  const dropped = (D.droppedIds || []).length;
  const cov = all.length ? Math.round(withEv * 100 / all.length) : 0;

  const cards = [
    {k:"有效做法", v:w + "/3", s:"上限 3 条", st: w > 3 ? "bad" : ""},
    {k:"弯路", v:dt + "/2", s:"上限 2 条", st: dt > 2 ? "bad" : ""},
    {k:"笔记合计", v:String(total), s: total > 5 ? "超出 5 条（含第一步），建议拆成两次复盘" : "含「下次第一步」1 条", st: total > 5 ? "bad" : ""},
    {k:"证据覆盖", v:cov + "%", s: withEv + "/" + all.length + " 项有依据", st: cov < 60 ? "warn" : ""},
    {k:"待验证", v:String(pending), s: pending ? "建议先小范围试跑" : "无", st: pending ? "warn" : ""},
    {k:"已滤除", v:String(dropped), s: dropped ? (D.droppedIds || []).join(" · ") + "（低把握）" : "低把握度未入页", st: ""}
  ];
  const box = document.getElementById("gates");
  box.innerHTML = "";
  cards.forEach(c => {
    const g = el("div","gate" + (c.st ? " " + c.st : ""));
    g.appendChild(el("div","gk", c.k));
    g.appendChild(el("div","gv", c.v));
    g.appendChild(el("div","gs", c.s));
    box.appendChild(g);
  });
}

/* ---------- 候选卡 ---------- */
function renderLists(){
  Object.keys(TYPE_META).forEach(type => {
    const host = document.getElementById("list-" + type);
    if(!host) return;
    host.innerHTML = "";
    const arr = itemsBy(type);
    const cnt = document.getElementById("cnt-" + type);
    if(cnt) cnt.textContent = arr.length ? arr.length + " 项" : "无";
    if(!arr.length){
      host.appendChild(el("div","empty","（本类暂无候选——不是每个任务都需要四类都沉淀）"));
      return;
    }
    arr.forEach(it => host.appendChild(buildCard(it)));
  });
}

function buildCard(it){
  const card = el("div","card");
  card.id = "card-" + it.id;

  const label = el("label","card-head");
  const cb = el("input");
  cb.type = "checkbox";
  cb.addEventListener("change", () => toggle(it.id, cb.checked));
  label.appendChild(cb);

  const span = el("span");
  span.appendChild(el("span","card-id", it.id));
  span.appendChild(el("span","card-title", it.title));
  label.appendChild(span);
  card.appendChild(label);

  if(it.why) card.appendChild(el("div","card-why", it.why));

  // 元信息条
  const metas = el("div","metas");
  if(it.confidence === "medium") metas.appendChild(el("span","meta conf-medium","待验证"));
  if(it.confidence === "high")   metas.appendChild(el("span","meta conf-high","已验证"));
  if(it.scope){
    const scopeTxt = {single:"仅本次", recurring:"同类重复", cross:"跨任务通用"}[it.scope] || it.scope;
    metas.appendChild(el("span","meta scope-" + it.scope, scopeTxt));
  }
  if(it.evidence) metas.appendChild(el("span","meta meta-ev","依据：" + it.evidence));
  if(metas.children.length) card.appendChild(metas);

  // 提示词框
  const pb = el("div","prompt-box");
  pb.id = "pb-" + it.id;
  const pl = el("div","prompt-label");
  pl.appendChild(document.createTextNode("可执行提示词（勾选后可用）"));
  const cp = el("span","copy-mini","复制");
  cp.addEventListener("click", () => copyOne(it.id));
  pl.appendChild(cp);
  pb.appendChild(pl);

  const ta = el("textarea");
  ta.id = "ta-" + it.id;
  ta.readOnly = true;
  ta.value = it.prompt || "";
  pb.appendChild(ta);
  card.appendChild(pb);

  return card;
}

function toggle(id, checked){
  const pb = document.getElementById("pb-" + id);
  const card = document.getElementById("card-" + id);
  if(pb) pb.classList.toggle("show", checked);
  if(card) card.classList.toggle("checked", checked);
}

function isChecked(id){
  const cb = document.querySelector("#card-" + id + " input");
  return !!(cb && cb.checked);
}

function selectAll(v){
  items().forEach(it => {
    const cb = document.querySelector("#card-" + it.id + " input");
    if(cb){ cb.checked = v; toggle(it.id, v); }
  });
}

function copyOne(id){
  const ta = document.getElementById("ta-" + id);
  if(ta) copyText(ta.value);
}

function copyChecked(){
  const sel = items().filter(it => isChecked(it.id));
  if(!sel.length){ alert("请先勾选至少一项"); return; }
  const txt = sel.map(it => "【" + it.id + "】" + it.title + "\n" + it.prompt).join("\n\n－－－－－－\n\n");
  copyText(txt);
}

function buildSummary(){
  const sel = items().filter(it => isChecked(it.id));
  if(!sel.length){ alert("请先勾选至少一项"); return; }
  const order = ["memory","skill","prompt","manual"];
  let out = "请执行以下已确认的复盘沉淀项：\n\n";
  order.forEach(t => {
    const g = sel.filter(it => it.type === t);
    if(!g.length) return;
    out += "=== " + TYPE_META[t].label + "类 ===\n\n";
    g.forEach(it => { out += "【" + it.id + "】" + it.title + "\n" + it.prompt + "\n\n"; });
  });
  const box = document.getElementById("summaryBox");
  box.value = out.trim();
  box.scrollIntoView({behavior:"smooth"});
}

function copySummary(){
  const v = document.getElementById("summaryBox").value;
  if(!v){ alert("请先点「生成确认清单」"); return; }
  copyText(v);
}

/* ---------- 复盘笔记导出（图片 2 的成品形态） ---------- */
function noteText(){
  const f = D.findings || {};
  const lines = [];
  lines.push("这次任务结束了，留一份笔记给下次的我：");
  lines.push("");
  lines.push("任务：" + (D.task || "（未填写）"));
  lines.push("");
  const w = (f.worked || []).slice(0,3);
  const dt = (f.detours || []).slice(0,2);
  let n = 1;
  w.forEach(x => {
    lines.push(n++ + ". 管用的做法：" + x.text + (x.evidence ? "（依据：" + x.evidence + "）" : ""));
  });
  dt.forEach(x => {
    lines.push(n++ + ". 走过的弯路：" + x.text + (x.fix ? " → 下次避开方式：" + x.fix : ""));
  });
  if(f.firstStep) lines.push(n++ + ". 下次第一步先做：" + f.firstStep);
  lines.push("");
  lines.push("（共 " + (n-1) + " 条；没把握的已剔除）");
  return lines.join("\n");
}

function copyNote(){ copyText(noteText()); }

/* ---------- 通用复盘提示词（下次开工前直接复用） ---------- */
function retroPromptText(){
  const scopeHint = {
    single:    "本次是单次任务，沉淀上限 1 条，优先提示词类；不要把一次性巧合写进长期记忆。",
    recurring: "本次属同类重复任务，主力沉淀记忆（口径/事实）与技能（流程）。",
    cross:     "本次经验跨任务通用，主力沉淀改进手册（方法论）与全局记忆。"
  }[D.scope] || "先判断范围（单次 / 同类重复 / 跨任务通用），再决定沉淀层级。";

  return [
    "这次任务结束了，请写一份复盘笔记，留给下次的你。",
    "",
    "任务：【" + (D.task || "一句话描述这次的任务") + "】",
    "",
    "按下面四层来写，缺哪层直接说「本层无内容」，不要凑：",
    "",
    "1. 事实层 — 这次哪些做法管用？（只写有结果支撑的；每条必须附一句「依据：xxx」）",
    "2. 归因层 — 哪些地方走了弯路？根因归到四类之一：信息缺失 / 判断错误 / 执行失误 / 工具缺陷；并给出一句「下次避开方式」。",
    "3. 迁移层 — 下次遇到同类任务，第一步先做什么？（必须是可执行的第一个动作，不是原则）",
    "4. 元改层 — Harness（提示词 / 工具 / 记忆 / 技能）哪一环该改？",
    "",
    "约束：",
    "- 每条一句话；有效做法 ≤3 条、弯路 ≤2 条，合计不超过 5 条",
    "- 没把握的不写；说不出依据的不写",
    "- 最后再补一句：这条经验在什么条件下不成立（迁移边界）",
    "",
    scopeHint,
    "",
    "（下次开工前，把这份笔记直接发给 AI，或让它参考以前的复盘）"
  ].join("\n");
}
function copyRetroPrompt(){ copyText(retroPromptText()); }

/* ---------- 剪贴板 ---------- */
function copyText(t){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(()=>alert("已复制到剪贴板"), ()=>fallbackCopy(t));
  } else { fallbackCopy(t); }
}
function fallbackCopy(t){
  const ta = document.createElement("textarea");
  ta.value = t; ta.style.position = "fixed"; ta.style.left = "-9999px";
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand("copy"); alert("已复制"); }
  catch(e){ alert("复制失败，请手动选择文本复制"); }
  document.body.removeChild(ta);
}
